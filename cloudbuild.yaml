substitutions:
  _REGION: europe-west3
  _ARTIFACT_REPOSITORY: debate-repo
  _IMAGE_NAME: debate-app
  _CLUSTER_NAME: debate-cluster
  _CLUSTER_LOCATION: europe-west3
  _NAMESPACE: logicflow

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 3600s

steps:
  - id: "restore-lfs-models"
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        if python3 scripts/check_model_artifacts.py; then
          exit 0
        fi

        if [ ! -d .git ]; then
          echo "Model files are unresolved LFS pointers and Cloud Build source has no .git directory."
          echo "Use a Cloud Build GitHub trigger with LFS support, or run git lfs pull before gcloud builds submit."
          exit 1
        fi

        apt-get update
        apt-get install -y --no-install-recommends git-lfs
        git lfs install --local
        git lfs pull --include="models/**"
        python3 scripts/check_model_artifacts.py

  - id: "tests"
    name: "python:3.13"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        pip install uv
        uv sync --frozen
        uv run pytest -q

  - id: "render-manifests"
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "bash"
    env:
      - "CLOUDSDK_COMPUTE_REGION=${_REGION}"
      - "CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}"
    args:
      - "-ceu"
      - |
        kubectl kustomize k8s >/workspace/rendered-k8s.yaml

  - id: "build-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:latest"
      - "."

  - id: "push-image-sha"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}"

  - id: "push-image-latest"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:latest"

  - id: "deploy-gke"
    name: "gcr.io/cloud-builders/gke-deploy"
    args:
      - "run"
      - "--filename=/workspace/rendered-k8s.yaml"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}"
      - "--location=${_CLUSTER_LOCATION}"
      - "--cluster=${_CLUSTER_NAME}"
      - "--namespace=${_NAMESPACE}"

  - id: "rollout-status"
    name: "gcr.io/cloud-builders/kubectl"
    env:
      - "CLOUDSDK_COMPUTE_REGION=${_CLUSTER_LOCATION}"
      - "CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}"
    args:
      - "rollout"
      - "status"
      - "deployment/logicflow-app"
      - "-n"
      - "${_NAMESPACE}"
      - "--timeout=600s"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:latest"
