steps:
  # 0. CI tests
  - name: "python:3.13"
    entrypoint: "bash"
    args:
      - "-c"
      - "pip install uv && uv sync --frozen && uv run pytest -q"

  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west3-docker.pkg.dev/$PROJECT_ID/debate-repo/debate-app:$SHORT_SHA', '.']

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west3-docker.pkg.dev/$PROJECT_ID/debate-repo/debate-app:$SHORT_SHA']

  # 3. Deploy to GKE
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - --filename=kubernetes-manifests.yaml
      - --image=europe-west3-docker.pkg.dev/$PROJECT_ID/debate-repo/debate-app:$SHORT_SHA
      - --location=europe-west3
      - --cluster=debate-cluster
