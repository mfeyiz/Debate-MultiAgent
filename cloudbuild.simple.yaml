steps:
  # 1. Docker imajını oluştur
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "europe-west3-docker.pkg.dev/$PROJECT_ID/debate-platform-repository/debate-app:$SHORT_SHA"
      - "-t"
      - "europe-west3-docker.pkg.dev/$PROJECT_ID/debate-platform-repository/debate-app:latest"
      - "."

  # 2. İmajı Artifact Registry'ye pushla
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west3-docker.pkg.dev/$PROJECT_ID/debate-platform-repository/debate-app:$SHORT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west3-docker.pkg.dev/$PROJECT_ID/debate-platform-repository/debate-app:latest"

  # 3. GKE'ye deploy et
  - name: "gcr.io/cloud-builders/gke-deploy"
    args:
      - "run"
      - "--filename=kubernetes-manifests.yaml"
      - "--image=europe-west3-docker.pkg.dev/$PROJECT_ID/debate-platform-repository/debate-app:$SHORT_SHA"
      - "--location=europe-west3"
      - "--cluster=debate-cluster"
