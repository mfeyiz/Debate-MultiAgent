apiVersion: apps/v1
kind: Deployment
metadata:
  name: debate-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: debate-app
  template:
    metadata:
      labels:
        app: debate-app
    spec:
      containers:
      - name: debate-app
        image: debate-app-image # Updated by Cloud Build
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: debate-service
spec:
  type: NodePort
  selector:
    app: debate-app
  ports:
  - port: 80
    targetPort: 5000
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: debate-ssl-cert
spec:
  domains:
    - chat.mammas.studio
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: debate-ingress
  annotations:
    kubernetes.io/ingress.global-static-ip-name: "debate-ip"
    networking.gke.io/managed-certificates: "debate-ssl-cert"
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - host: chat.mammas.studio
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: debate-service
            port:
              number: 80
