name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  test:
    name: Tests and manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify model artifacts
        run: uv run python scripts/check_model_artifacts.py

      - name: Run tests
        run: uv run pytest -q

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s >/tmp/logos-k8s.yaml
