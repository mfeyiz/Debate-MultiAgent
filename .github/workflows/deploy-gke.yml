name: Deploy to GKE

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Artifact Registry region"
        required: true
        default: "europe-west3"
      artifact_repository:
        description: "Artifact Registry repository"
        required: true
        default: "debate-platform-repository"
      image_name:
        description: "Docker image name"
        required: true
        default: "logos-app"
      cluster_name:
        description: "GKE cluster name"
        required: true
        default: "debate-cluster"
      cluster_location:
        description: "GKE cluster region or zone"
        required: true
        default: "europe-west3"

jobs:
  deploy:
    name: Cloud Build deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify model artifacts
        run: python scripts/check_model_artifacts.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions=_REGION=${{ inputs.region }},_ARTIFACT_REPOSITORY=${{ inputs.artifact_repository }},_IMAGE_NAME=${{ inputs.image_name }},_CLUSTER_NAME=${{ inputs.cluster_name }},_CLUSTER_LOCATION=${{ inputs.cluster_location }}
