[project]
name = "multiagentargumentmining"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.125.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "numpy>=2.4.4",
    "psycopg2-binary>=2.9.9",
    "pydantic-ai>=1.91.0",
    "python-dotenv>=1.2.2",
    "redis>=5.0.0",
    "torch>=2.3.0",
    "pytorch-crf>=0.7.2",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "seqeval>=1.2.2",
    "scikit-learn>=1.5.0",
    "accelerate>=0.30.0",
    "uvicorn[standard]>=0.38.0",
    "greenlet>=3.5.0",
    "gunicorn>=26.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
