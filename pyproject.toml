[project]
name = "multiagentargumentmining"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.125.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "numpy>=2.4.4",
    "psycopg2-binary>=2.9.9",
    "pydantic-ai-slim[openai]>=1.91.0",
    "python-dotenv>=1.2.2",
    "redis>=5.0.0",
    "torch==2.4.1 ; python_version < '3.13'",
    "torch>=2.6.0 ; python_version >= '3.13'",
    "transformers>=4.51.0,<5",
    "uvicorn[standard]>=0.38.0",
    "greenlet>=3.5.0",
    "gunicorn>=26.0.0",
    "google-cloud-storage>=3.6.0",
    "datasets>=4.8.5",
    "scikit-learn>=1.8.0",
    "accelerate>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
    "slow: tests that load real ModernBERT artifacts or run full debate analysis",
]
