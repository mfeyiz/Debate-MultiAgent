apiVersion: v1
kind: ConfigMap
metadata:
  name: logos-config
data:
  PORT: "8080"
  DEFAULT_MODEL: "openai/gpt-4o-mini"
  MAX_DEBATE_ROUNDS: "5"
  EVIDENCE_STRENGTH_THRESHOLD: "0.65"
  PIPELINE_EVAL_INTERVAL: "2"
  GUNICORN_WORKERS: "2"
  GUNICORN_TIMEOUT: "120"
  GUNICORN_GRACEFUL_TIMEOUT: "30"
  GUNICORN_LOGLEVEL: "info"
  COMPONENT_MODEL_DIR: "/app/models/component_classifier/final"
  RELATION_MODEL_DIR: "/app/models/relation_classifier/final"
