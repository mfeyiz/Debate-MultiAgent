apiVersion: v1
kind: ConfigMap
metadata:
  name: logicflow-config
  namespace: logicflow
data:
  PORT: "8080"
  DEFAULT_MODEL: "openai/gpt-4o-mini"
  MAX_DEBATE_ROUNDS: "5"
  EVIDENCE_STRENGTH_THRESHOLD: "0.65"
  PIPELINE_EVAL_INTERVAL: "2"
  GUNICORN_WORKERS: "4"
  GUNICORN_TIMEOUT: "30"
  GUNICORN_LOGLEVEL: "info"
  # Model paths inside the container
  COMPONENT_MODEL_DIR: "/app/models/component_extractor/final"
  RELATION_MODEL_DIR: "/app/models/relation_classifier/final"
