apiVersion: apps/v1
kind: Deployment
metadata:
  name: logicflow-app
  namespace: logicflow
  labels:
    app: logicflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logicflow
  template:
    metadata:
      labels:
        app: logicflow
    spec:
      serviceAccountName: logicflow-app
      containers:
        - name: app
          image: europe-west3-docker.pkg.dev/project-2b7e04f8-32a9-4c3a-9a4/debate-platform-repository/debate-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: logicflow-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: logicflow-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: logicflow-secrets
                  key: REDIS_URL
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logicflow-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: logicflow-secrets
                  key: SECRET_KEY
            - name: GOOGLE_FACTCHECK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logicflow-secrets
                  key: GOOGLE_FACTCHECK_API_KEY
                  optional: true
            - name: TCMB_EVDS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logicflow-secrets
                  key: TCMB_EVDS_API_KEY
                  optional: true
            - name: TUIK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logicflow-secrets
                  key: TUIK_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "2000m"
              memory: "6Gi"
            limits:
              cpu: "4000m"
              memory: "12Gi"
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
