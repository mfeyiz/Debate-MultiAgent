apiVersion: apps/v1
kind: Deployment
metadata:
  name: logicflow-app
  namespace: logicflow
  labels:
    app: logicflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logicflow
  template:
    metadata:
      labels:
        app: logicflow
    spec:
      serviceAccountName: logicflow-app
      containers:
        - name: app
          image: logicflow-image-placeholder
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: logicflow-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: logicflow-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: logicflow-secrets
                  key: REDIS_URL
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logicflow-secrets
                  key: OPENROUTER_API_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: logicflow-secrets
                  key: SECRET_KEY
            - name: FLASK_DEBUG
              value: "false"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
          args:
            - "--structured-logs"
            - "--port=5432"
            - "<DB_CONNECTION_NAME>"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
