apiVersion: apps/v1
kind: Deployment
metadata:
  name: logos-app
  labels:
    app: logos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logos
  template:
    metadata:
      labels:
        app: logos
    spec:
      serviceAccountName: logos-app
      containers:
        - name: app
          image: logos-image-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: logos-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: logos-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: logos-secrets
                  key: REDIS_URL
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logos-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: logos-secrets
                  key: SECRET_KEY
            - name: GOOGLE_FACTCHECK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logos-secrets
                  key: GOOGLE_FACTCHECK_API_KEY
                  optional: true
            - name: TCMB_EVDS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logos-secrets
                  key: TCMB_EVDS_API_KEY
                  optional: true
            - name: TUIK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logos-secrets
                  key: TUIK_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "1000m"
              memory: "3Gi"
            limits:
              cpu: "2000m"
              memory: "6Gi"
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
