apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logos-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "logos-ingress-ip"
    networking.gke.io/managed-certificates: "logos-ssl-cert"
    networking.gke.io/v1beta1.FrontendConfig: "logos-frontend-config"
spec:
  rules:
    - host: chat.mammas.studio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: logos-service
                port:
                  number: 8080
